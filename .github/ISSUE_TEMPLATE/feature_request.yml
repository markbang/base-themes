name: Feature request
description: Suggest a component, theme, block, docs page, or workflow improvement.
title: "[Feature]: "
labels: ["type: feature"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Component
        - Theme
        - Block
        - Registry/agent workflow
        - Docs/site
        - Testing/release
        - Example app
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What adoption, customization, accessibility, or development problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the change and expected user-facing behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a PR for this.
        - label: This should include docs or examples.
        - label: This affects registry metadata or source-copy workflows.
