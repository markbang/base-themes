name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install -g npm@latest
      - run: npm run registry:check
      - run: npm run lint
      - run: npm run build
      - name: Check published version
        id: package-version
        run: |
          version="$(node -p "require('./package.json').version")"
          published="$(npm view "$(node -p "require('./package.json').name")@$version" version 2>/dev/null || true)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"
      - run: npm publish --access public --provenance
        if: steps.package-version.outputs.published != steps.package-version.outputs.version
      - run: echo "base-themes@${{ steps.package-version.outputs.version }} is already published; skipping npm publish."
        if: steps.package-version.outputs.published == steps.package-version.outputs.version
