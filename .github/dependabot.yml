version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react*"
      vite:
        patterns:
          - vite
          - "@vitejs/*"
      linting:
        patterns:
          - eslint
          - "@eslint/*"
          - "typescript-eslint"
          - "eslint-plugin-*"
      cloudflare:
        patterns:
          - wrangler
          - "@cloudflare/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
